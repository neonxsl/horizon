name: ARM64 server build
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Horizon tag or commit to build (a nightly-source tag builds a tested release)
        default: nightly-source/2026-10-30-1da354b
jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the engine (server build) and horizon-server
        run: |
          cargo build --release --locked -p horizon-client --no-default-features --bin horizon-client
          cargo build --release --locked -p horizon-server --bin horizon-server
          mkdir -p out
          cp target/release/horizon-client out/horizon-engine
          cp target/release/horizon-server out/
          tar czf horizon-server-linux-arm64.tar.gz -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-server-linux-arm64
          path: horizon-server-linux-arm64.tar.gz
